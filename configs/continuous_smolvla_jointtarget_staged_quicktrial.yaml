base_config: continuous_smolvla_template.yaml

control:
  official:
    config_overrides:
      n_action_steps: 1
  action:
    control_mode: joint_target
    action_dim: 6
    horizon: 50

data_continuous:
  train_path: data/continuous_jointtarget_staged_quicktrial/train.npz
  val_path: data/continuous_jointtarget_staged_quicktrial/val.npz
  test_path: data/continuous_jointtarget_staged_quicktrial/test.npz
  history_len: 2
  action_horizon: 50
  task_text_enabled: true

official_train:
  dataset:
    repo_id: roarm_continuous_train_smolvla_jointtarget_staged_quicktrial
    root: data/lerobot/roarm_continuous_train_smolvla_jointtarget_staged_quicktrial
  batch_size: 2
  steps: 30000
  save_freq: 2500
  eval_freq: 0
  output_dir: outputs/train/lerobot/smolvla_jointtarget_staged_quicktrial
  job_name: roarm_smolvla_jointtarget_staged_quicktrial
  policy_device: cuda
  wandb_enable: false

early_stop:
  enabled: true
  max_steps: 30000
  stage_steps: 2500
  patience: 2
  min_delta: 0.0
  episodes_per_task: 8
  validation_batch_size: 2
  validation_max_batches: 32
