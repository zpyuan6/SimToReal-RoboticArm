base_config: continuous_smolvla_template.yaml

control:
  official:
    config_overrides:
      chunk_size: 8
      n_action_steps: 1
  action:
    control_mode: joint_delta
    action_dim: 6
    horizon: 8
    clamp_low: [-0.25, -0.25, -0.25, -0.25, -0.25, -0.5]
    clamp_high: [0.25, 0.25, 0.25, 0.25, 0.25, 0.5]

sim:
  staged_resets:
    level2_approach: level1_verify
    level3_pick_place: level2_approach
  staged_reset_max_attempts: 12

continuous_expert:
  max_arm_delta: 0.25
  max_gripper_delta: 0.5

data_continuous:
  train_path: data/continuous_jointdelta_staged_quicktrial/train.npz
  val_path: data/continuous_jointdelta_staged_quicktrial/val.npz
  test_path: data/continuous_jointdelta_staged_quicktrial/test.npz
  history_len: 2
  action_horizon: 8
  task_text_enabled: true

official_train:
  dataset:
    repo_id: roarm_continuous_train_smolvla_jointdelta_staged_v2
    root: data/lerobot/roarm_continuous_train_smolvla_jointdelta_staged_v2
  batch_size: 2
  steps: 30000
  save_freq: 2500
  eval_freq: 0
  output_dir: outputs/train/lerobot/smolvla_jointdelta_staged_v2
  job_name: roarm_smolvla_jointdelta_staged_v2
  policy_device: cuda
  wandb_enable: false

early_stop:
  enabled: true
  max_steps: 30000
  stage_steps: 2500
  patience: 2
  min_delta: 0.0
  episodes_per_task: 8
  validation_batch_size: 2
  validation_max_batches: 32
