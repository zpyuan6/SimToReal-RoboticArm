base_config: base.yaml

control:
  enabled: true
  backbone_name: diffusion_policy
  family: generative_diffusion_control
  image_shape: [224, 224, 3]
  proprio_dim: 16
  uses_language: false
  latent_adapter_target: diffusion_condition_latent
  official:
    provider: lerobot
    policy_type: diffusion
    policy_path:
    enforce_official_training: true
    config_overrides:
      horizon: 8
      n_action_steps: 2
      drop_n_last_frames: 5
  action:
    control_mode: joint_delta
    action_dim: 6
    horizon: 2

data_continuous:
  train_path: data/continuous_v2/train.npz
  val_path: data/continuous_v2/val.npz
  test_path: data/continuous_v2/test.npz
  history_len: 2
  action_horizon: 2
  task_text_enabled: false

official_train:
  dataset:
    repo_id: roarm_continuous_train_v2
    root: data/lerobot/roarm_continuous_train_v2
  batch_size: 8
  steps: 50000
  save_freq: 5000
  eval_freq: 0
  output_dir: outputs/train/lerobot/diffusion_v2_reactive
  job_name: roarm_diffusion_v2_reactive
  policy_device: cuda
  wandb_enable: false

early_stop:
  enabled: true
  max_steps: 50000
  stage_steps: 5000
  patience: 2
  min_delta: 0.0
  episodes_per_task: 8
  validation_batch_size: 8
  validation_max_batches: 64
