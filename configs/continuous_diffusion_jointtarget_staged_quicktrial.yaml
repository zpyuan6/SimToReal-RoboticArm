base_config: continuous_diffusion_reactive1.yaml

control:
  action:
    control_mode: joint_target
    action_dim: 6
    horizon: 1

sim:
  staged_resets:
    level2_approach: level1_verify
    level3_pick_place: level2_approach
  staged_reset_max_attempts: 12

data_continuous:
  train_path: data/continuous_jointtarget_staged_quicktrial/train.npz
  val_path: data/continuous_jointtarget_staged_quicktrial/val.npz
  test_path: data/continuous_jointtarget_staged_quicktrial/test.npz
  history_len: 1
  action_horizon: 1

official_train:
  dataset:
    repo_id: roarm_continuous_train_diffusion_jointtarget_staged_quicktrial
    root: data/lerobot/roarm_continuous_train_diffusion_jointtarget_staged_quicktrial
  output_dir: outputs/train/lerobot/diffusion_jointtarget_staged_quicktrial
  job_name: roarm_diffusion_jointtarget_staged_quicktrial
