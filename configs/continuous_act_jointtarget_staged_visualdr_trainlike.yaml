base_config: continuous_act_jointtarget_staged_quicktrial.yaml

sim:
  task_context_rescaling: false
  context:
    camera_translation_jitter: 0.010
    camera_rotation_jitter: 0.020
    fov_jitter: 4.0
    light_jitter: 0.30
    blur_sigma: 0.8
    noise_std: 0.02
    action_gain_low: 1.0
    action_gain_high: 1.0
    action_delay_max: 0
    joint_bias: 0.0

data_continuous:
  train_path: data/continuous_jointtarget_staged_visualdr_trainlike/train.npz
  val_path: data/continuous_jointtarget_staged_visualdr_trainlike/val.npz
  test_path: data/continuous_jointtarget_staged_visualdr_trainlike/test.npz

official_train:
  dataset:
    repo_id: roarm_continuous_train_jointtarget_staged_visualdr_trainlike
    root: data/lerobot/roarm_continuous_train_jointtarget_staged_visualdr_trainlike
  output_dir: outputs/train/lerobot/act_jointtarget_staged_visualdr_trainlike
  job_name: roarm_act_jointtarget_staged_visualdr_trainlike
