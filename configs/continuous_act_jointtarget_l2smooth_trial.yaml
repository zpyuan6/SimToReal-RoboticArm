base_config: continuous_act_template.yaml

control:
  action:
    control_mode: joint_target
    horizon: 2
  official:
    config_overrides:
      chunk_size: 12
      n_action_steps: 2

data_continuous:
  train_path: data/continuous_jointtarget_l2smooth_trial/train.npz
  val_path: data/continuous_jointtarget_l2smooth_trial/val.npz
  test_path: data/continuous_jointtarget_l2smooth_trial/test.npz
  history_len: 2
  action_horizon: 2

official_train:
  dataset:
    repo_id: roarm_continuous_train_jointtarget_l2smooth_trial
    root: data/lerobot/roarm_continuous_train_jointtarget_l2smooth_trial
  batch_size: 8
  steps: 30000
  save_freq: 2500
  eval_freq: 0
  output_dir: outputs/train/lerobot/act_jointtarget_l2smooth_trial
  job_name: roarm_act_jointtarget_l2smooth_trial
  policy_device: cuda
  wandb_enable: false

early_stop:
  enabled: true
  max_steps: 30000
  stage_steps: 2500
  patience: 2
  min_delta: 0.0
  episodes_per_task: 12
  validation_batch_size: 8
  validation_max_batches: 64
